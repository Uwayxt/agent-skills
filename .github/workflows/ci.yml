name: CI / Quality Gate & Registry Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. REGISTRY STRUCTURE & INTEGRITY VALIDATION ───────────────────────────
  audit-registry:
    name: 🛡️ Audit Skills Registry & Structure Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Skills Directory Structure (45 Skills)
        run: |
          echo "Checking skills directory structure..."
          MISSING=0
          SKILL_COUNT=0
          FAILED_SKILLS=""

          for dir in .agents/skills/*/; do
            [ -d "$dir" ] || continue
            SKILL_COUNT=$((SKILL_COUNT+1))
            name=$(basename "$dir")

            if [ ! -f "$dir/SKILL.md" ]; then
              echo "❌ Missing SKILL.md in: $name"
              MISSING=$((MISSING+1))
              FAILED_SKILLS="$FAILED_SKILLS $name"
            fi

            if [ ! -f "$dir/agents/openai.yaml" ]; then
              echo "❌ Missing agents/openai.yaml in: $name"
              MISSING=$((MISSING+1))
              FAILED_SKILLS="$FAILED_SKILLS $name"
            fi
          done

          echo "Total skills detected: $SKILL_COUNT"

          if [ $SKILL_COUNT -lt 45 ]; then
            echo "❌ Expected at least 45 skills, found $SKILL_COUNT."
            exit 1
          fi

          if [ $MISSING -gt 0 ]; then
            echo "❌ Structure audit failed — $MISSING missing files in:$FAILED_SKILLS"
            exit 1
          fi

          echo "✅ All $SKILL_COUNT skills have valid SKILL.md and agents/openai.yaml."

      - name: Validate Skills Lock Integrity (SHA-256)
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');

          // skills-lock.json is optional — gracefully skip if absent
          const lockPath = 'skills-lock.json';
          if (!fs.existsSync(lockPath)) {
            console.log('ℹ️  skills-lock.json not present — skipping hash verification.');
            console.log('   (This is expected when the lockfile is managed locally.)');
            process.exit(0);
          }

          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const entries = Object.entries(lock.skills || {});

          if (entries.length === 0) {
            console.log('ℹ️  No entries in skills-lock.json — skipping.');
            process.exit(0);
          }

          let mismatches = 0;
          let verified = 0;
          let missing = 0;

          for (const [name, data] of entries) {
            const skillPath = path.join('.agents', 'skills', name, 'SKILL.md');
            if (!fs.existsSync(skillPath)) {
              console.warn(`⚠️  Lock entry skill file not found: ${skillPath} — skipping.`);
              missing++;
              continue;
            }
            const content = fs.readFileSync(skillPath);
            const hash = crypto.createHash('sha256').update(content).digest('hex');
            const expectedHash = typeof data === 'string' ? data : data?.computedHash;
            if (hash !== expectedHash) {
              console.error(`❌ SHA-256 Mismatch for [${name}]`);
              console.error(`   Expected: ${expectedHash}`);
              console.error(`   Got:      ${hash}`);
              mismatches++;
            } else {
              verified++;
            }
          }

          console.log(`\nVerified: ${verified} | Skipped (missing): ${missing} | Failed: ${mismatches}`);

          if (mismatches > 0) {
            console.error(`❌ ${mismatches} skill signatures failed SHA-256 verification.`);
            process.exit(1);
          }

          console.log('✅ All available skill lockfile hashes verified successfully.');
          SCRIPT

      - name: Validate NPM Bundle Size Budget
        run: |
          echo "Running npm pack --dry-run..."
          PACK_OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$PACK_OUTPUT"

          # Extract unpacked size and fail if > 600KB
          UNPACKED=$(echo "$PACK_OUTPUT" | grep "unpacked size" | grep -oE '[0-9]+(\.[0-9]+)? kB' | head -1 | grep -oE '[0-9]+(\.[0-9]+)?')
          echo ""
          echo "Unpacked size: ${UNPACKED} kB"

          if [ -z "$UNPACKED" ]; then
            echo "ℹ️  Could not parse unpacked size — skipping budget check."
          elif (( $(echo "$UNPACKED > 600" | bc -l) )); then
            echo "❌ NPM bundle exceeds 600 kB budget: ${UNPACKED} kB"
            exit 1
          else
            echo "✅ Bundle size within 600 kB budget: ${UNPACKED} kB"
          fi

  # ─── 2. CLI CROSS-PLATFORM & GENERATOR MATRIX ───────────────────────────────
  test-cli-matrix:
    name: ⚡ CLI Smoke Test · ${{ matrix.os }} · Node ${{ matrix.node-version }}
    needs: audit-registry
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Core CLI Router (help & list)
        run: |
          node bin/cli.js help
          node bin/cli.js list
        shell: bash

      - name: Test All 8 CLI Automation Generators
        run: |
          mkdir -p tmp_ci_test
          node bin/cli.js tokens:build                          && echo "✅ tokens:build"
          node bin/cli.js scaffold:module CISlice ./tmp_ci_test && echo "✅ scaffold:module"
          node bin/cli.js audit:routes ./tmp_ci_test            && echo "✅ audit:routes"
          node bin/cli.js audit:cognitive ./tmp_ci_test         && echo "✅ audit:cognitive"
          node bin/cli.js chaos:inject ./tmp_ci_test            && echo "✅ chaos:inject"
          node bin/cli.js gen:playwright ./tmp_ci_test          && echo "✅ gen:playwright"
          node bin/cli.js doctor ./tmp_ci_test                  && echo "✅ doctor"
          node bin/cli.js audit:drift ./tmp_ci_test             && echo "✅ audit:drift"
        shell: bash

      - name: Cleanup test artifacts
        if: always()
        run: rm -rf tmp_ci_test styles/
        shell: bash
